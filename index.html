<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store Twin — the AI guesses, the twin calculates</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --navy:#003E7B; --blue:#0A8FD8; --yellow:#FDB913; --red:#D64545; --green:#2E9E5B;
          --bg:#F3F1EC; --card:#FFFFFF; --ink:#1B1B1B; --muted:#666; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Sora","Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:17px; }
  header { background:var(--navy); color:#fff; padding:12px 26px; display:flex; align-items:center; gap:16px; }
  header h1 { margin:0; font-size:24px; }
  header .logo { height:30px; display:block; }
  header .sep { width:1px; align-self:stretch; background:#ffffff55; }
  header .tag { background:var(--yellow); color:var(--navy); font-weight:800; padding:4px 12px; border-radius:12px; font-size:14px; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  header button { background:transparent; color:#fff; border:1px solid #ffffff90; border-radius:6px; padding:5px 11px; cursor:pointer; font:inherit; font-size:14px; font-weight:700; }
  header button.on { background:#fff; color:var(--navy); }
  .banner { background:#FFF4D6; border-bottom:2px solid var(--yellow); padding:7px 26px; font-size:15px; color:#5A4500; }
  .banner b { color:var(--navy); }
  main { display:grid; grid-template-columns: 380px 1fr; gap:18px; padding:16px 26px; }
  .card { background:var(--card); border-radius:14px; padding:14px 18px; box-shadow:0 1px 3px #0001; }
  h2 { margin:0 0 8px; font-size:15px; color:var(--navy); text-transform:uppercase; letter-spacing:.5px; }
  .store { display:flex; gap:8px; }
  .prod { flex:1; text-align:center; background:#F7F7F7; border-radius:10px; padding:6px 2px; font-size:13px; }
  .prod .ico { font-size:28px; } .prod b { display:block; font-size:14px; }
  .note { font-size:13px; color:var(--muted); margin-top:6px; }
  textarea { width:100%; height:78px; font:inherit; font-size:17px; padding:9px; border-radius:10px; border:2px solid #ddd; resize:none; }
  .chips { display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .chip { text-align:left; background:#EEF5FB; border:1px solid #CFE3F3; color:var(--navy); border-radius:8px; padding:7px 10px; cursor:pointer; font:inherit; font-size:14px; }
  .chip:hover { background:#DDEDF9; } .chip.sel { border:2px solid var(--navy); }
  .vote { display:flex; gap:8px; align-items:center; margin:6px 0 10px; font-size:14px; }
  .vote input { width:90px; font:inherit; font-size:18px; padding:5px 8px; border-radius:8px; border:2px solid #ddd; }
  .go { width:100%; background:var(--yellow); color:var(--navy); border:0; border-radius:10px; padding:12px; font:inherit; font-size:18px; font-weight:800; cursor:pointer; }
  .go:disabled { opacity:.5; cursor:wait; }
  .steps { display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-content:start; }
  .step { position:relative; opacity:.3; transition:opacity .4s; }
  .step.on { opacity:1; }
  .step .n { position:absolute; top:-10px; left:-8px; background:var(--navy); color:#fff; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:800; }
  .big { font-size:44px; font-weight:800; line-height:1.05; }
  .big small { font-size:14px; font-weight:600; color:var(--muted); display:block; }
  .row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end; }
  .pill { display:inline-block; background:#F0F0F0; border-radius:20px; padding:4px 10px; margin:4px 4px 0 0; font-size:14px; }
  .pill.warn { background:#FFE3E3; color:#8A1F1F; }
  .ai { border-left:6px solid var(--blue); } .twin { border-left:6px solid var(--navy); } .gap { grid-column:1/-1; border-left:6px solid var(--yellow); }
  .expl { font-size:18px; line-height:1.45; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .wide { grid-column:1/-1; }
  .legend span { display:inline-flex; align-items:center; gap:5px; margin-right:16px; font-size:14px; }
  .legend i { width:13px; height:13px; display:inline-block; border-radius:2px; }
  .again { background:#fff; border:2px solid var(--blue); color:var(--blue); border-radius:8px; padding:5px 10px; font:inherit; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
  .again.thinking { background:var(--blue); color:#fff; cursor:wait; animation:pulse 1.2s ease-in-out infinite; }
  .again.thinking .es2 { color:#DDEFFB; }
  .again .dots::after { content:""; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 #0A8FD866} 50%{box-shadow:0 0 0 8px #0A8FD800} }
  .step.waiting .big, .step.waiting .tries { opacity:.35; transition:opacity .3s; }
  .tries { margin-top:6px; font-size:16px; }
  .tries span { display:inline-block; background:#E8F4FC; border-radius:6px; padding:2px 8px; margin:2px 4px 0 0; font-weight:700; color:var(--blue); }
  .three { display:flex; gap:10px; margin-top:6px; }
  .three div { flex:1; text-align:center; border-radius:10px; padding:6px; background:#F7F7F7; }
  .three b { display:block; font-size:28px; }
  .three .t { background:#E6EEF7; } .three .t b { color:var(--navy); }
  .err { color:var(--red); font-size:14px; margin-top:8px; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  .outscope { display:none; background:#FFE3E3; color:#8A1F1F; border-radius:10px; padding:10px 12px; font-size:17px; font-weight:700; margin-top:8px; }
  .es2 { display:block; font-size:.78em; color:#5A6B80; font-style:italic; font-weight:500; margin-top:2px; }
  header .es2 { color:#CFE0F2; } .banner .es2 { color:#7A6420; }
  .bi .big { font-size:40px; }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--navy); color:#fff; font-size:14px;
           padding:7px 26px; display:flex; align-items:center; gap:12px; z-index:10; }
  footer img { height:18px; }
  footer .es2 { display:inline; margin-left:14px; color:#CFE0F2; font-size:13px; }
  body { padding-bottom:40px; }
  .spinner { display:none; margin-left:8px; } .busy .spinner { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

 pt:{powered:"Desenvolvido por <b>Cassiano R. N. Moralles</b> · Unilasalle",title:"Gêmeo da Loja",tag:"A IA chuta · o gêmeo calcula",store:"Loja de exemplo (dados inventados) — semana normal",p_ice:"Sorvete",p_water:"Água",p_coffee:"Café",wk:"sem",
   banner:"Este modelo didático só muda 4 coisas: <b>demanda</b> · <b>preço</b> · <b>atraso do fornecedor</b> · <b>estoque extra</b>. Os resultados dependem das premissas.",
   synthetic:"Dados inventados para ensino, 8 semanas. Toda semana a loja repõe para ter cerca de 1,6 semana de vendas normais na prateleira.",
   ask:"Faça uma pergunta 'e se…?'",vote:"Palpite da sala (variação da receita):",run:"Perguntar à IA + rodar o gêmeo",s1:"A IA entendeu",s2:"Chute rápido da IA (sem calculadora)",
   s3:"Cálculo do gêmeo (8 semanas)",s4:"Comparar",rev:"receita vs. normal",margin:"margem bruta vs. normal",srv:"demanda atendida",lost:"vendas perdidas",
   l_sold:"vendido",l_lost:"perdido (prateleira vazia)",l_normal:"demanda normal",product:"Produto",demand:"Demanda",price:"Preço",delay:"Atraso do fornecedor",extra:"Estoque extra",from:"A partir da semana",
   all:"todos os produtos",weeks:"semanas",units:"unid.",again:"↻ Perguntar de novo à IA",thinking:"⏳ A IA está pensando",room:"A sala",ai_short:"A IA",twin_short:"O gêmeo",
   outscope:"Esta pergunta está fora deste modelo simples. Ele só entende demanda, preço, atraso do fornecedor e estoque extra.",
   adjusted:"ajustado ao limite do modelo",offline:"IA indisponível — use ⏯ Ensaio (respostas gravadas).",replay_btn:"Ensaio",
   replay_note:"Respostas gravadas do ensaio",
   presets:["E se o fornecedor atrasar 2 semanas em tudo a partir da semana 2?","E se uma onda de calor aumentar a procura por sorvete em 80% a partir da semana 2?","Onda de calor: sorvete +80%, mas mantemos 300 sorvetes a mais na prateleira.","E se baixarmos o preço do café em 20%?"]}
};
// bilingual (EN+ES) dictionary built from EN and ES
const INLINE=new Set(["wk","product","demand","price","delay","extra","from","all","weeks","units","room","ai_short","twin_short","p_ice","p_water","p_coffee","l_sold","l_lost","l_normal","replay_btn","rev","margin","srv","lost","adjusted"]);
T.bi={};
for(const k of Object.keys(T.en)){
  const a=T.en[k], b=T.es[k];
  if(Array.isArray(a)) T.bi[k]=a.map((x,i)=>[x,b[i]]);
  else T.bi[k]= a===b ? a : (INLINE.has(k) ? `${a} / ${b}` : `${a}<span class="es2">${b}</span>`);
}
const two=(en,es)=>es&&es!==en?`${esc(en)}<span class="es2">${esc(es)}</span>`:esc(en||"");
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
let lang="en", presetIdx=null, lastQ="", replayMode=false, tries=[], replayData=null;
const $=id=>document.getElementById(id);
const dec=v=>(lang==="en"||lang==="bi")?String(v):String(v).replace(".",",");
const fmtPct=v=>{const n=Math.round(Number(v)*10)/10; return (n>0?"+":"")+dec(n)+"%";};
const fmtUSD=v=>"US$ "+Math.round(v).toLocaleString((lang==="en"||lang==="bi")?"en-US":(lang==="es"?"es-ES":"pt-BR"));
function setLang(l){
  lang=l; document.documentElement.lang=l==="bi"?"en":l; document.body.classList.toggle("bi",l==="bi");
  document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=T[l][e.dataset.t]);
  document.querySelectorAll("header button[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  $("chips").innerHTML="";
  T[l].presets.forEach((p,i)=>{const b=document.createElement("button");b.className="chip";
    const qtext=Array.isArray(p)?p[0]:p;
    b.innerHTML=(i+1)+". "+(Array.isArray(p)?two(p[0],p[1]):esc(p));
    b.onclick=()=>{$("q").value=qtext;presetIdx=i;document.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));b.classList.add("sel");};$("chips").appendChild(b);});
}
document.querySelectorAll("header button[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("offline").onclick=()=>{replayMode=!replayMode;$("offline").classList.toggle("on",replayMode);};
$("q").addEventListener("input",()=>{presetIdx=null;document.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));});

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function show(id){$(id).classList.add("on");}
function reset(){["s1","s2","s3","s4"].forEach(i=>$(i).classList.remove("on"));
  ["g_rev","g_srv","t_rev","t_mar","t_srv","t_lost"].forEach(i=>{$(i).firstChild.textContent="–";$(i).className="big";});
  ["restated","params","g_txt","chart","expl","meta","err","tries","c_room","c_ai","c_twin"].forEach(i=>$(i).innerHTML="");
  $("outscope").style.display="none"; $("again").style.display="none"; tries=[];}

function paramPills(p,adj){
  const t=T[lang],names={ice_cream:t.p_ice,water:t.p_water,coffee:t.p_coffee,all:t.all},A={};
  (adj||[]).forEach(a=>A[a.lever]=a);
  const warn=k=>A[k]?` <span class="pill warn">${dec(A[k].asked)} → ${dec(A[k].used)}: ${t.adjusted}</span>`:"";
  const out=[`${t.product}: <b>${names[p.product]}</b>`];
  if(p.demand_change_pct) out.push(`${t.demand}: <b>${fmtPct(p.demand_change_pct)}</b>`+warn("demand_change_pct"));
  if(p.price_change_pct) out.push(`${t.price}: <b>${fmtPct(p.price_change_pct)}</b>`+warn("price_change_pct"));
  if(p.supplier_delay_weeks) out.push(`${t.delay}: <b>${p.supplier_delay_weeks} ${t.weeks}</b>`+warn("supplier_delay_weeks"));
  if(p.extra_stock_units) out.push(`${t.extra}: <b>+${p.extra_stock_units} ${t.units}</b>`+warn("extra_stock_units"));
  out.push(`${t.from}: <b>${p.start_week}</b>`);
  return out.map(s=>`<span class="pill">${s}</span>`).join("");
}
function setBig(id,val,good){const e=$(id);e.firstChild.textContent=val;e.className="big "+(good===undefined?"":(good?"pos":"neg"));}
function chart(tw){
  const names=tw.params.product==="all"?Object.keys(tw.weeks):[tw.params.product];
  const W=[...Array(8).keys()].map(i=>{let s=0,l=0,n=0;names.forEach(k=>{s+=tw.weeks[k][i].sold;l+=tw.weeks[k][i].lost;n+=tw.weeks_baseline[k][i].demand;});return{s,l,n};});
  const max=Math.max(...W.map(w=>Math.max(w.s+w.l,w.n)))*1.1,H=160,BW=60,G=26,X0=40;
  let svg=`<svg width="100%" viewBox="0 0 ${X0+8*(BW+G)} ${H+30}">`;
  W.forEach((w,i)=>{const x=X0+i*(BW+G),hs=H*w.s/max,hl=H*w.l/max;
    svg+=`<rect x="${x}" y="${H-hs}" width="${BW}" height="${hs}" fill="#003E7B" rx="3"/>`;
    if(w.l) svg+=`<rect x="${x}" y="${H-hs-hl}" width="${BW}" height="${hl}" fill="#D64545" rx="3"/>`;
    svg+=`<text x="${x+BW/2}" y="${H+20}" font-size="14" text-anchor="middle" fill="#555">${lang==="en"?"W":(lang==="bi"?"W/S":"S")}${i+1}</text>`;});
  svg+=`<polyline points="${W.map((w,i)=>`${X0+i*(BW+G)+BW/2},${H-H*w.n/max}`).join(" ")}" fill="none" stroke="#FDB913" stroke-width="4" stroke-dasharray="8 5"/></svg>`;
  $("chart").innerHTML=svg;
}
function showGuess(g){
  tries.push(Number(g.revenue_change_pct));
  setBig("g_rev",fmtPct(g.revenue_change_pct)); setBig("g_srv",Math.round(g.demand_fulfilled_pct ?? g.customers_served_pct)+"%");
  $("g_txt").innerHTML=lang==="bi"?"“"+two(g.sentence,g.sentence_es)+"”":"“"+esc(g.sentence||"")+"”";
  $("tries").innerHTML=tries.length>1?tries.map(v=>`<span>${fmtPct(v)}</span>`).join(""):"";
  $("c_ai").textContent=tries.map(fmtPct).join(" · ");
}
function renderTwin(tw){
  setBig("t_rev",fmtPct(tw.delta.revenue_change_pct),tw.delta.revenue_change_pct>=0);
  setBig("t_mar",fmtPct(tw.delta.gross_margin_change_pct),tw.delta.gross_margin_change_pct>=0);
  setBig("t_srv",dec(tw.scenario.demand_fulfilled_pct)+"%",tw.scenario.demand_fulfilled_pct>=99.5);
  setBig("t_lost",fmtUSD(tw.scenario.lost_sales_usd),tw.scenario.lost_sales_usd===0);
  chart(tw); show("s3");
  $("c_twin").textContent=fmtPct(tw.delta.revenue_change_pct);
}
async function post(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(d.error)throw new Error(d.error);return d;}

$("go").onclick=async()=>{
  const q=$("q").value.trim(); if(!q) return;
  reset(); lastQ=q; $("go").disabled=true; $("go").classList.add("busy");
  const v=$("vote").value; $("c_room").textContent=v===""?"–":fmtPct(v);
  try{
    let d;
    if(replayMode){
      if(presetIdx===null) throw new Error("rehearsal: pick 1–4");
      d=await post("/api/replay",{idx:presetIdx,lang:lang==="pt"?"en":lang}); replayData=d;
      if(lang==="bi"&&d.guesses_es) d.guesses=d.guesses.map((g,i)=>({...g,sentence_es:(d.guesses_es[i]||{}).sentence}));
      if(lang==="bi") d.guess=d.guesses[0];
    } else d=await post("/api/ask",{question:q,lang});
    $("restated").innerHTML=lang==="bi"?two(d.restated_en||d.restated||q,d.restated_es):esc(d.restated||q);
    $("params").innerHTML=paramPills(d.twin.params,d.twin.adjusted); show("s1");
    if(!d.twin.in_scope){ $("outscope").innerHTML=T[lang].outscope; $("outscope").style.display="block"; return; }
    await sleep(800); showGuess(d.guess); show("s2"); $("again").style.display="inline-block";
    await sleep(900); renderTwin(d.twin);
    await sleep(700);
    $("expl").innerHTML=lang==="bi"?`<div>${esc(d.explanation)}</div><div class="es2" style="font-size:.9em;margin-top:8px">${esc(d.explanation_es)}</div>`:esc(d.explanation);
    show("s4");
    $("meta").innerHTML=d.replay?`${T[lang].replay_note} (${d.recorded_at})`:`AI via Ollama Cloud · ${d.seconds.reduce((a,b)=>a+b,0).toFixed(1)} s`;
  }catch(e){ $("err").innerHTML=T[lang].offline+" ("+esc(e.message)+")"; }
  finally{ $("go").disabled=false; $("go").classList.remove("busy"); }
};
function thinkingLabel(){
  // "The AI is thinking..." with animated dots; bilingual mode shows both languages
  if(lang==="bi") return `${T.en.thinking}<span class="dots"></span><span class="es2">${T.es.thinking}<span class="dots"></span></span>`;
  return `${T[lang].thinking}<span class="dots"></span>`;
}
$("again").onclick=async()=>{
  const btn=$("again"), card=$("s2");
  btn.disabled=true; btn.classList.add("thinking"); btn.innerHTML=thinkingLabel(); card.classList.add("waiting");
  const t0=Date.now();
  try{
    let g;
    if(replayMode&&replayData){ g=replayData.guesses[tries.length % replayData.guesses.length]; }
    else { g=(await post("/api/guess",{question:lastQ,lang})).guess; }
    const wait=900-(Date.now()-t0); if(wait>0) await sleep(wait);   // always visible for at least ~1 s
    showGuess(g);
  }catch(e){ $("err").innerHTML=T[lang].offline+" ("+esc(e.message)+")"; }
  finally{ btn.disabled=false; btn.classList.remove("thinking"); btn.innerHTML=T[lang].again; card.classList.remove("waiting"); }
};
setLang("en");
</script>
</body>
</html>
